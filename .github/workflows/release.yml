name: Build Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    if: github.event.repository.fork == false
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version and check existing release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $line = Select-String -Path core.py -Pattern '^APP_VERSION = "([^"]+)"$'
          if (-not $line) { throw "APP_VERSION was not found in core.py" }
          $version = $line.Matches[0].Groups[1].Value
          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Install runtime packages
        if: steps.version.outputs.exists == 'false'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        if: steps.version.outputs.exists == 'false'
        run: |
          python -m unittest test_core.py test_playlist_stream.py
          python -m py_compile app.py core.py i18n.py strip_audio.py

      - name: Compile portable launcher
        if: steps.version.outputs.exists == 'false'
        shell: cmd
        run: |
          mkdir "release-stage\BI3L Media Downloader\App"
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          pushd build
          rc /nologo /fo launcher.res launcher.rc
          cl /nologo /O2 /MT /DUNICODE /D_UNICODE launcher.c launcher.res /Fe:"..\release-stage\BI3L Media Downloader\BI3L Media Downloader.exe" /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib
          popd

      - name: Package portable ZIP
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $app = "release-stage\BI3L Media Downloader\App"
          Copy-Item app.py, core.py, i18n.py, strip_audio.py, requirements.txt, setup.bat, run.bat, README.md -Destination $app
          Copy-Item assets -Destination $app -Recurse
          New-Item -ItemType Directory -Force -Path release-output | Out-Null
          Compress-Archive -Path "release-stage\BI3L Media Downloader" -DestinationPath "release-output\BI3L Media Downloader.zip" -CompressionLevel Optimal

      - name: Prepare offline builder
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $app = "offline_builder\App"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item app.py, core.py, i18n.py, strip_audio.py, requirements.txt, setup.bat, run.bat, README.md -Destination $app
          Copy-Item assets -Destination $app -Recurse

      - name: Install Inno Setup
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build offline installer
        if: steps.version.outputs.exists == 'false'
        shell: cmd
        env:
          CI: "1"
        run: call "offline_builder\Build Offline Installer.bat"

      - name: Generate SHA-256 checksums
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $portable = "release-output\BI3L Media Downloader.zip"
          $installer = "offline_builder\Output\BI3L Media Downloader Setup.exe"
          $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $lines = @(
            "$portableHash  BI3L Media Downloader.zip"
            "$installerHash  BI3L Media Downloader Setup.exe"
          )
          $lines | Set-Content "release-output\SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create $env:RELEASE_TAG `
            "release-output\BI3L Media Downloader.zip" `
            "offline_builder\Output\BI3L Media Downloader Setup.exe" `
            "release-output\SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --title "BI3L Media Downloader $env:RELEASE_VERSION" `
            --notes-file RELEASE_NOTES.md `
            --latest
